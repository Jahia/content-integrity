# Content integrity: the scan reports stored in the JCR, under /sites/systemsite/files/content-integrity-reports
#
# A background job deletes the reports of the scans started more than retentionDays days ago, except those still
# running. 0 keeps all the reports.
retentionDays = 30
# The interval between two cleanups, in hours. A cleanup also runs as soon as this configuration changes.
cleanupIntervalHours = 24
